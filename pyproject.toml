[project]
name = "carhunter"
version = "0.1.0"
description = "Universal car marketplace search engine"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.34,<1.0", "pydantic>=2.10,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0", "ruff>=0.9,<1.0"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
